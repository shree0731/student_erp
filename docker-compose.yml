version: '3.8'

services:
  # 1. Python ML Microservice (FastAPI + XGBoost + SHAP)
  ml-service:
    build:
      context: ../ai-dropout-prediction/ml-service
      dockerfile: Dockerfile
    container_name: insighterp-ml-service
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8001}:8001"
    environment:
      - PORT=8001
      - MODEL_DIR=/app/models

  # 2. Standalone AI Gateway & Copilot
  ai-gateway:
    build:
      context: ../ai-dropout-prediction/backend
      dockerfile: Dockerfile
    container_name: insighterp-ai-gateway
    restart: unless-stopped
    ports:
      - "${AI_GATEWAY_PORT:-5001}:5001"
    environment:
      - PORT=5001
      - NODE_ENV=${NODE_ENV:-production}
      - ML_SERVICE_URL=http://ml-service:8001
      - API_KEY=${AI_SERVICE_API_KEY}
      - SESSION_TOKEN_SECRET=${SESSION_TOKEN_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5000}
    depends_on:
      - ml-service

  # 3. Institutional College ERP Backend
  erp-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insighterp-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - APP_DB_ROLE=erp
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - AI_SERVICE_BASE_URL=http://ai-gateway:5001
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY}
      - ERP_SERVICE_API_KEY=${ERP_SERVICE_API_KEY}
      - OTP_ENABLED=${OTP_ENABLED:-true}
      - OTP_TTL_SECONDS=${OTP_TTL_SECONDS:-300}
      - DEMO_SHARED_EMAIL=${DEMO_SHARED_EMAIL}
      - NOTIFY_TRANSPORT=${NOTIFY_TRANSPORT:-smtp}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - EMAIL_DRY_RUN=${EMAIL_DRY_RUN:-false}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5000}
    depends_on:
      - ai-gateway
